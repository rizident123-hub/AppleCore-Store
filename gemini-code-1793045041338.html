<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iStore 18 - Нові та б/у iPhone | Інтернет-магазин</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #1a1c23;
            --accent: #ff9f0a;
            --accent-hover: #e08b00;
            --text-main: #ffffff;
            --text-muted: #9ba1a6;
            --border: #2d3139;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgba(26, 28, 35, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--accent);
        }

        .cart-btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-btn:hover {
            background-color: var(--accent-hover);
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(180deg, rgba(255,159,10,0.1) 0%, rgba(15,16,21,0) 100%);
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 60px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .product-img-container {
            width: 100%;
            height: 220px;
            background-color: #242731;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .product-img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge.new {
            background-color: #34c759;
            color: #000;
        }

        .badge.used {
            background-color: var(--accent);
            color: #000;
        }

        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .product-specs {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .product-price {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        .buy-btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .buy-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Модальне вікно кошика */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .close-modal:hover {
            color: var(--text-main);
        }

        .modal-title {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .cart-items-list {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .cart-total {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }

        .checkout-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
        }

        .checkout-btn {
            width: 100%;
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 14px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">iStore <span>18</span></a>
        <button class="cart-btn" onclick="toggleCart()">
            🛒 Кошик (<span id="cart-count">0</span>)
        </button>
    </header>

    <div class="hero">
        <h1>Топові iPhone у наявності</h1>
        <p>Найновіші серії 18 Pro, Duo та перевірені б/у флагмани у найкращому стані.</p>
    </div>

    <div class="container">
        <div class="filters">
            <button class="filter-btn active" onclick="filterProducts('all')">Усі моделі</button>
            <button class="filter-btn" onclick="filterProducts('new')">Тільки Нові</button>
            <button class="filter-btn" onclick="filterProducts('used')">Тільки Б/У</button>
        </div>

        <div class="products-grid" id="products-grid">
            <!-- Товари генеруються через JS -->
        </div>
    </div>

    <!-- Модальне вікно кошика -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="toggleCart()">&times;</span>
            <div class="modal-title">Ваш кошик</div>
            <div class="cart-items-list" id="cart-items-list">
                <!-- Товари в кошику -->
            </div>
            <div class="cart-total">
                <span>Разом:</span>
                <span id="cart-total-price">0 ₴</span>
            </div>
            <div class="checkout-form">
                <input type="text" id="client-name" placeholder="Ваше ім'я">
                <input type="tel" id="client-phone" placeholder="Номер телефону">
                <button class="checkout-btn" onclick="checkout()">Оформити замовлення</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 iStore 18. Усі права захищені.</p>
    </footer>

    <script>
        const products = [
            {
                id: 1,
                name: "Apple iPhone 18 Pro Max",
                category: "new",
                specs: "256GB • Cosmic Orange • Новий (Офіційна гарантія)",
                price: 64499,
                img: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 2,
                name: "Apple iPhone 18 Pro",
                category: "new",
                specs: "256GB • Deep Blue • Новий (e-SIM)",
                price: 58099,
                img: "https://images.unsplash.com/photo-1695048065583-659f5188f6c6?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 3,
                name: "Apple iPhone 18 Duo",
                category: "new",
                specs: "512GB • Star White • Інноваційний подвійний екран",
                price: 79999,
                img: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 4,
                name: "Apple iPhone 17 Pro Max",
                category: "new",
                specs: "256GB • Silver • Новий",
                price: 67099,
                img: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 5,
                name: "б/у iPhone 15 Pro Max",
                category: "used",
                specs: "256GB • Natural Titanium • Ідеальний стан, акумулятор 92%",
                price: 35499,
                img: "https://images.unsplash.com/photo-1695048065583-659f5188f6c6?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 6,
                name: "б/у iPhone 14 Pro",
                category: "used",
                specs: "128GB • Deep Purple • Гарний стан, повний комплект",
                price: 27999,
                img: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 7,
                name: "б/у iPhone 12 Pro Max",
                category: "used",
                specs: "128GB • Pacific Blue • Як новий, перевірена батарея",
                price: 13799,
                img: "https://images.unsplash.com/photo-1510557880182-3d4d3cba35a5?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 8,
                name: "б/у iPhone 11",
                category: "used",
                specs: "128GB • Black • Робочий стан, гарантія магазину",
                price: 9999,
                img: "https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=500&auto=format&fit=crop&q=60"
            }
        ];

        let cart = [];

        function renderProducts(filter = 'all') {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);

            filtered.forEach(product => {
                const badgeText = product.category === 'new' ? 'Новий' : 'Б/У';
                const badgeClass = product.category === 'new' ? 'new' : 'used';

                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-img-container">
                            <span class="badge ${badgeClass}">${badgeText}</span>
                            <img src="${product.img}" alt="${product.name}" class="product-img">
                        </div>
                        <div class="product-info">
                            <div class="product-title">${product.name}</div>
                            <div class="product-specs">${product.specs}</div>
                            <div class="product-footer">
                                <div class="product-price">${product.price.toLocaleString()} ₴</div>
                                <button class="buy-btn" onclick="addToCart(${product.id})">Купити</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterProducts(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderProducts(category);
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCartCount();
        }

        function updateCartCount() {
            document.getElementById('cart-count').innerText = cart.length;
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('active');
            if(modal.classList.contains('active')) {
                renderCartItems();
            }
        }

        function renderCartItems() {
            const list = document.getElementById('cart-items-list');
            list.innerHTML = '';
            let total = 0;

            if(cart.length === 0) {
                list.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Кошик порожній</p>';
            } else {
                cart.forEach((item, index) => {
                    total += item.price;
                    list.innerHTML += `
                        <div class="cart-item">
                            <span>${item.name}</span>
                            <span><b>${item.price.toLocaleString()} ₴</b></span>
                        </div>
                    `;
                });
            }
            document.getElementById('cart-total-price').innerText = total.toLocaleString() + ' ₴';
        }

        function checkout() {
            const name = document.getElementById('client-name').value;
            const phone = document.getElementById('client-phone').value;

            if(!name || !phone) {
                alert('Будь ласка, заповніть ім’я та телефон!');
                return;
            }

            if(cart.length === 0) {
                alert('Кошик порожній!');
                return;
            }

            alert(`Дякуємо за замовлення, ${name}! Менеджер зв'яжеться з вами за номером ${phone} найближчим часом.`);
            cart = [];
            updateCartCount();
            toggleCart();
        }

        // Первинне завантаження каталогу
        renderProducts();
    </script>
</body>
</html>
